name: "Deployment Scroll - Label Trigger"

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  deploy-scroll:
    if: ${{ github.event.label && github.event.label.name == 'insert' }}
    runs-on: ubuntu-latest
    name: "Run Deployment Scroll"
    steps:
      - name: "Add 'scoring-constellation' label"
        uses: actions/github-script@v6
        with:
          script: |
            const label = 'scoring-constellation';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });

      - name: "Post deployment scroll comment"
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
            const body = `:sparkles: Deployment Scroll triggered by label 'insert'. Auto-added label 'scoring-constellation'. Runners ascending.`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: "Placeholder - Run deployment steps"
        run: |
          echo "Runners would start here. Add real deployment steps."
